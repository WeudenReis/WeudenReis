  <text x="72" y="242" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#8a93a3">Extensões, automações e produtos web que resolvem problema de verdade.</text>
