    .scan { animation: scan 6s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateX(-420px); } 100% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .cursor, .scan { animation: none; } }
  </style>
