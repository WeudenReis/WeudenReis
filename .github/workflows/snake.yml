# Gera a cobrinha que come o gráfico de contribuições e publica na branch "output".
name: Cobrinha

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#7c2d12&color_dots=#ebedf0,#fed7aa,#fdba74,#fb923c,#c2410c
            dist/snake-dark.svg?palette=github-dark&color_snake=#fff7ed&color_dots=#151b23,#5a2410,#9a3412,#e2571c,#ff7a33

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
