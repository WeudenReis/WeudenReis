# Gera a cobrinha que come o gráfico de contribuições e publica na branch "output".
name: Cobrinha

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#3b4a34&color_dots=#ebedf0,#cfd8bd,#a3b18a,#7b8c5c,#4a5d3f
            dist/snake-dark.svg?palette=github-dark&color_snake=#ece8d9&color_dots=#151b23,#2b3627,#3f5234,#5c6b4a,#8c9a6b

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
